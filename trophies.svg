    <rect x="24" y="0" width="98" height="2.5" rx="1" fill="#f43f8e" filter="url(#glow)"/>
    <text x="73" y="23" text-anchor="middle" fill="#f43f8e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ANALYTICS</text>
