<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" width="1120" height="190">
  <defs>
    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131924"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <!-- 3D Metallic Gold Gradient -->
    <linearGradient id="gold3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5800"/>
      <stop offset="22%" stop-color="#ffd700"/>
      <stop offset="42%" stop-color="#fff6b3"/>
      <stop offset="65%" stop-color="#e5a900"/>
      <stop offset="88%" stop-color="#8a6200"/>
      <stop offset="100%" stop-color="#d49b00"/>
    </linearGradient>

    <!-- 3D Metallic Platinum/Cyan Gradient -->
    <linearGradient id="cyan3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005e54"/>
      <stop offset="24%" stop-color="#00f5d4"/>
      <stop offset="44%" stop-color="#d4fff8"/>
      <stop offset="68%" stop-color="#00bfa5"/>
      <stop offset="90%" stop-color="#004d40"/>
      <stop offset="100%" stop-color="#00d8bd"/>
    </linearGradient>

    <!-- 3D Metallic Sapphire Blue Gradient -->
    <linearGradient id="blue3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123a73"/>
      <stop offset="24%" stop-color="#58a6ff"/>
      <stop offset="44%" stop-color="#dbeeff"/>
      <stop offset="68%" stop-color="#2f81f7"/>
      <stop offset="90%" stop-color="#0c2d5c"/>
      <stop offset="100%" stop-color="#4895ef"/>
    </linearGradient>

    <!-- 3D Metallic Rose-Magenta Gradient -->
    <linearGradient id="rose3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b1038"/>
      <stop offset="24%" stop-color="#f43f8e"/>
      <stop offset="44%" stop-color="#ffd6e8"/>
      <stop offset="68%" stop-color="#d61c6c"/>
      <stop offset="90%" stop-color="#4f0828"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- 3D Pedestal Gradient -->
    <linearGradient id="base3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1f29"/>
      <stop offset="35%" stop-color="#3a4354"/>
      <stop offset="55%" stop-color="#525e75"/>
      <stop offset="85%" stop-color="#222834"/>
      <stop offset="100%" stop-color="#151922"/>
    </linearGradient>

    <!-- Cup Inner Shadow -->
    <linearGradient id="cupHollow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#3b2f0b"/>
    </linearGradient>

    <!-- Specular Shine Sweep -->
    <linearGradient id="shineSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CARD 1: COMMITS (GOLD) -->
  <g transform="translate(8, 10)">
    <rect width="146" height="170" rx="14" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="24" y="0" width="98" height="2.5" rx="1" fill="#ffd700" filter="url(#glow)"/>
    <text x="73" y="23" text-anchor="middle" fill="#ffd700" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">COMMITS</text>
    <rect x="53" y="30" width="40" height="15" rx="7" fill="#2a2105" stroke="#ffd700" stroke-width="0.8"/>
    <text x="73" y="41" text-anchor="middle" fill="#ffd700" font-family="'Fira Code', monospace" font-size="9" font-weight="700">RANK S</text>

    <!-- Floating 3D Trophy -->
    <g transform="translate(73, 98)">
      <animateTransform attributeName="transform" type="translate" values="73 98; 73 93; 73 98" dur="3.2s" repeatCount="indefinite"/>
      <!-- Aura -->
      <circle cx="0" cy="-10" r="30" fill="#ffd700" opacity="0.08" filter="url(#glow)"/>
      <!-- Handles -->
      <path d="M-19,-26 C-31,-26 -31,-8 -16,-6" fill="none" stroke="url(#gold3d)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M19,-26 C31,-26 31,-8 16,-6" fill="none" stroke="url(#gold3d)" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Chalice Body -->
      <path d="M-20,-30 L20,-30 C20,-8 12,4 0,6 C-12,4 -20,-8 -20,-30 Z" fill="url(#gold3d)"/>
      <!-- Top Rim & Inner Hollow -->
      <ellipse cx="0" cy="-30" rx="20" ry="4.5" fill="#fff3a8"/>
      <ellipse cx="0" cy="-30" rx="17" ry="3" fill="url(#cupHollow)"/>
      <!-- Stem -->
      <path d="M-4,5 L4,5 L6,18 L-6,18 Z" fill="url(#gold3d)"/>
      <ellipse cx="0" cy="12" rx="6" ry="2.2" fill="#fff3a8"/>
      <!-- 3D Pedestal -->
      <path d="M-15,18 L15,18 L18,24 L-18,24 Z" fill="url(#gold3d)"/>
      <rect x="-20" y="24" width="40" height="11" rx="2" fill="url(#base3d)" stroke="#ffd700" stroke-width="0.6"/>
      <rect x="-12" y="27" width="24" height="5" rx="1" fill="url(#gold3d)"/>
      <!-- Sparkle -->
      <path d="M-24,-34 L-22,-29 L-17,-27 L-22,-25 L-24,-20 L-26,-25 L-31,-27 L-26,-29 Z" fill="#fff9d6">
        <animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="73" y="156" text-anchor="middle" fill="#c9d1d9" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600">CODE VELOCITY</text>
  </g>

  <!-- CARD 2: REPOSITORIES (CYAN) -->
  <g transform="translate(168, 10)">
    <rect width="146" height="170" rx="14" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="24" y="0" width="98" height="2.5" rx="1" fill="#00f5d4" filter="url(#glow)"/>
    <text x="73" y="23" text-anchor="middle" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">REPOSITORIES</text>
    <rect x="53" y="30" width="40" height="15" rx="7" fill="#042622" stroke="#00f5d4" stroke-width="0.8"/>
    <text x="73" y="41" text-anchor="middle" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="9" font-weight="700">RANK A+</text>

    <g transform="translate(73, 98)">
      <animateTransform attributeName="transform" type="translate" values="73 98; 73 93; 73 98" dur="3.5s" begin="0.3s" repeatCount="indefinite"/>
      <circle cx="0" cy="-10" r="30" fill="#00f5d4" opacity="0.08" filter="url(#glow)"/>
      <path d="M-19,-26 C-31,-26 -31,-8 -16,-6" fill="none" stroke="url(#cyan3d)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M19,-26 C31,-26 31,-8 16,-6" fill="none" stroke="url(#cyan3d)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M-20,-30 L20,-30 C20,-8 12,4 0,6 C-12,4 -20,-8 -20,-30 Z" fill="url(#cyan3d)"/>
