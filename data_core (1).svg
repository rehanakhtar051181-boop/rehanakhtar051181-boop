<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#f43f8e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="248" height="248" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="130" cy="126" r="94" fill="url(#coreGlow)"/>

  <!-- Outer Rotating Dashed Ring -->
  <g transform="translate(130, 126)">
    <circle r="86" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="14 8 4 8" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Middle Counter-Rotating Arc Ring -->
  <g transform="translate(130, 126)">
    <circle r="68" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-dasharray="60 35 20 35" stroke-linecap="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Inner Pink/Blue Orbit Ring -->
  <g transform="translate(130, 126)">
    <circle r="50" fill="none" stroke="#f43f8e" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="0" r="3.5" fill="#00f5d4" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-50" cy="0" r="3.5" fill="#f43f8e" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center Hexagon -->
  <g transform="translate(130, 126)">
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="#161b22" stroke="#00f5d4" stroke-width="2" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.6s" repeatCount="indefinite"/>
    </polygon>

    <!-- Animated Analytics Bars Inside Core -->
    <rect x="-15" y="-2" width="6" height="14" rx="1.5" fill="#58a6ff">
      <animate attributeName="height" values="8;18;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;-6;4" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-4" y="-8" width="6" height="20" rx="1.5" fill="#00f5d4">
      <animate attributeName="height" values="14;24;14" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-2;-12;-2" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="7" y="-4" width="6" height="16" rx="1.5" fill="#f43f8e">
      <animate attributeName="height" values="10;20;10" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;-8;2" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HUD Label & Name -->
  <text x="130" y="28" text-anchor="middle" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">REHAN AKHTAR</text>
  <text x="130" y="238" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', monospace" font-size="10" font-weight="600" letter-spacing="1.8">DATA CORE • ACTIVE</text>
</svg>