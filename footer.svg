<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 110" width="1280" height="110">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="footLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f43f8e" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="110" rx="14" fill="url(#footBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="140" y="18" width="1000" height="1.5" fill="url(#footLine)"/>
  <rect x="140" y="17" width="80" height="3.5" rx="2" fill="#00f5d4" filter="url(#fGlow)">
    <animate attributeName="x" values="140;1060;140" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="56" text-anchor="middle" fill="#e6edf3" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="16" font-style="italic" letter-spacing="0.8">"Without data, you're just another person with an opinion."</text>
  <text x="640" y="84" text-anchor="middle" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="12" letter-spacing="3">— REHAN AKHTAR</text>
</svg>